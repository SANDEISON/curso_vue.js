<!DOCTYPE html>
<html>
<head>
  <title>Count Moose</title>

</head>
<body>

<h1>Exemplo de contar</h1>  

<div id="app">
  <p>{{ "Total: " + count }}</p>
  <button v-on:click="count++">Adicionando Item</button>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
  const app = Vue.createApp({
    data() {
      return {
        count: 0
      }
    }
  })
 app.mount('#app')
</script>

</body>
</html>
