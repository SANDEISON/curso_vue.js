<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Minha primeira página Vue</title>
</head>
<body>

  <div id="app">
    {{ message }}<br/>
    {{ valorTotal }}<br/>    
    {{ logado }}<br/>
    {{ passatempos }}<br/>
    {{ passatempos[2] }}<br/>
    {{ perfil }}<br/>
    {{ perfil.nome }}<br/>
    {{ perfil.cursos }}<br/>
    {{ perfil.cursos[0] }}<br/>
     {{ perfil.cursos[0].nome }}<br/>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          message: "Hello World!",
          valorTotal: 1500,
          logado: false,
          passatempos:[
            'Correr',
            'Tocar instrumentos',
            'Praia',
            'Cinema'
          ],
          perfil:{
            nome: 'Sandeison Fernandes',
            idade: 39,
            cursos:[

              {
                nome: 'Residência em Robótica e Inteligência Artificial',
                carga_horaria: '420 horas'
              },
              {
                nome: 'Análise e Desenvolvimento de Sistemas',
                carga_horaria: '2520 horas'
              }

            ]

          }

        }
      }
    })

   app.mount('#app')

  </script>
</body>
</html>
